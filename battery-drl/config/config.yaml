project:
  rated_capacity_ah: 2.0
  random_seed: 42
  device: cpu

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts
  train_csv: data/processed/train.csv
  val_csv: data/processed/val.csv
  test_csv: data/processed/test.csv
  health_model_checkpoint: artifacts/health_model.pt
  dqn_checkpoint: artifacts/dqn_agent.pt
  evaluation_csv: artifacts/evaluation_summary.csv

data:
  selected_batteries: [B0005, B0006, B0007, B0018]
  preferred_operation: charge
  sequence_length: 20
  split:
    train: 0.6
    val: 0.2
    test: 0.2

health_model:
  hidden_size: 64
  num_layers: 2
  dropout: 0.1
  batch_size: 64
  learning_rate: 0.001
  epochs: 15
  sequence_stride: 5

environment:
  target_soc: 0.85
  temp_limit_c: 40.0
  critical_temp_c: 46.0
  risk_limit: 0.65
  episode_horizon: 250
  nominal_capacity_ah: 2.0
  state_clip: 5.0
  action_current_multipliers:
    maintain: 1.0
    reduce: 0.8
    increase: 1.15
    pause: 0.0
    stop: 0.0
  action_temperature_delta_c:
    maintain: 0.0
    reduce: -0.5
    increase: 0.9
    pause: -1.0
    stop: -0.6
  normalization:
    soc: [0.0, 1.0]
    voltage: [2.0, 4.4]
    current: [-4.0, 4.0]
    temperature: [10.0, 60.0]
    soh: [0.5, 1.05]
    risk: [0.0, 1.0]
    temp_trend: [-2.0, 2.0]
    current_trend: [-2.0, 2.0]

rewards:
  soc_progress_weight: 8.0
  temp_penalty_weight: 3.0
  degradation_penalty_weight: 4.0
  unsafe_penalty: 12.0
  pause_penalty: 0.8
  stop_penalty: 1.5
  target_soc_bonus: 6.0

dqn:
  gamma: 0.99
  learning_rate: 0.001
  batch_size: 64
  buffer_size: 10000
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  target_update_frequency: 20
  hidden_dims: [128, 128]
  episodes: 120
  warmup_steps: 128

dashboard:
  default_replay_seconds: 0.4